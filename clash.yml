urlTestBase: &urlTestBase
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 3600
  tolerance: 50
  lazy: true
  
ruleProvidersBase: &ruleProvidersBase
  type: http
  interval: 86400
  behavior: classical
  format: text

mixed-port: 7890
allow-lan: true
mode: rule
log-level: warning
ipv6: false
dns:
  enable: true
  ipv6: false
  nameserver: ["https://1.1.1.1/dns-query", "https://8.8.8.8/dns-query", "1.1.1.1", "8.8.8.8"]
  nameserver-policy:
    geosite:cn: ["https://1.12.12.12/dns-query", "https://223.5.5.5/dns-query"]
  proxy-server-nameserver: ["https://1.12.12.12/dns-query", "https://223.5.5.5/dns-query"]
  fake-ip-filter: ["+.migu.cn", "+.migudm.cn"] # 咪咕开发VPN使用，离职后可删除
  
proxies: []

proxy-groups:
  - name: 🐱
    type: select
    proxies: ["♻️", DIRECT]
    include-all: true
  - name: "♻️"
    <<: *urlTestBase
    include-all: true
  - name: 🤖
    type: select
    include-all: true
    exclude-filter: 港|俄罗斯
    proxies: ['♻️AI代理自动选择']
  - name: '♻️AI代理自动选择'
    <<: *urlTestBase
    include-all: true
    exclude-filter: 港|俄罗斯
rule-providers:
  ai:
    <<: *ruleProvidersBase
    path: ./ruleset/ai.yaml
    url: https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/AI.list
  openAi:
    <<: *ruleProvidersBase
    path: ./ruleset/openAi.yaml
    url: https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/OpenAi.list
  gfw:
    <<: *ruleProvidersBase
    path: ./ruleset/gfw.yaml
    url: https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ProxyGFWlist.list
rules:
  # 给SB微信用
  - PROCESS-NAME,Weixin.exe,DIRECT
  - PROCESS-NAME,WeChatAppEx.exe,DIRECT

  - DOMAIN-KEYWORD,test.com,REJECT
  
  - DOMAIN-KEYWORD,ipfs,DIRECT
  - DOMAIN,www.sjwx.la,DIRECT
  - DOMAIN-KEYWORD,mostanswer,DIRECT
  - PROCESS-NAME,Photoshop.exe,REJECT
  - RULE-SET,ai,🤖
  - RULE-SET,openAi,🤖
  - RULE-SET,gfw,🐱
  - GEOIP,LAN,DIRECT
  - GEOIP,PRIVATE,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🐱
